name: Render approved V4 East City Asset
on:
  push:
    branches: [main]
    paths:
      - 'previews/v4-city-extension-continuous-r1/generate_east_asset.cjs'
      - '.github/workflows/render-v4-city-east.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering requirements
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m pip install --break-system-packages Pillow
      - name: Render the approved city east half from canvas
        run: |
          node previews/v4-city-extension-continuous-r1/generate_east_asset.cjs
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('previews/v4-city-extension-continuous-r1/assets/city_east.png')
          im=Image.open(p).convert('RGB')
          assert im.size==(1672,941)
          target=p.with_suffix('.webp')
          im.save(target,format='WEBP',lossless=True,method=6)
          print('OUTPUT',target,target.stat().st_size)
          p.unlink()
          PY
      - name: Commit generated art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/v4-city-extension-continuous-r1/assets/city_east.webp
          if ! git diff --cached --quiet; then
            git commit -m 'art(v4): render approved east city as lossless Godot asset'
            git push origin HEAD:main
          fi
