name: CT V4 Continuous City Preview QA
on:
  push:
    branches: [main]
    paths:
      - 'previews/v4-city-extension-continuous-r1/**'
      - '.github/workflows/v4-continuous-city-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test requirements
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check source fidelity, continuity, collisions, iPhone and desktop
        run: node previews/v4-city-extension-continuous-r1/test_preview.cjs
