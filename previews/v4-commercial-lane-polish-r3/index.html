  if(x>=sx-r&&x<=sx+sw+r&&y>=sy-r&&y<=sy+sh+r)return false;
 return true;
}
function move(dx,dy){
 if(!dx&&!dy)return 0;
 const beforeX=player.x,beforeY=player.y;
 const nx=player.x+dx,ny=player.y+dy;
 if(allowed(nx,ny)){player.x=nx;player.y=ny;}
 else{if(allowed(nx,player.y))player.x=nx;if(allowed(player.x,ny))player.y=ny;}
 return Math.hypot(player.x-beforeX,player.y-beforeY);
}
function getInput(){
 const controls=held.size>0||padHeld.size>0;
 if(controls){
  const right=held.has('ArrowRight')||held.has('d')||padHeld.has('ArrowRight');
  const left=held.has('ArrowLeft')||held.has('a')||padHeld.has('ArrowLeft');
  const down=held.has('ArrowDown')||held.has('s')||padHeld.has('ArrowDown');
  const up=held.has('ArrowUp')||held.has('w')||padHeld.has('ArrowUp');
  const x=Number(right)-Number(left),y=Number(down)-Number(up);
  if(x||y)return Math.abs(x)>=Math.abs(y)?{x:Math.sign(x),y:0}:{x:0,y:Math.sign(y)};
  return{x:0,y:0};
 }
 return input;
}
function updateMotion(dt){
 const v=getInput(),magnitude=Math.min(1,Math.hypot(v.x,v.y));
 let distance=0;
 if(magnitude>.02){
  const target=220*magnitude;
  player.actualSpeed=Math.min(target,player.actualSpeed+1200*dt);
  const d=player.actualSpeed*dt;
  if(Math.abs(v.x)>0){distance=move(Math.sign(v.x)*d,0);player.face=v.x<0?'left':'right';}
  else if(Math.abs(v.y)>0){distance=move(0,Math.sign(v.y)*d);player.face=v.y<0?'up':'down';}
 }else player.actualSpeed=0;
 player.moving=distance>.04;
 if(player.moving){player.stride+=distance;player.frame=Math.floor(player.stride/28)%4;}
 else{player.frame=0;player.stride=0;}
 return distance;
}
function actorDraw(){
 ctx.fillStyle='#0a16264a';ctx.beginPath();ctx.ellipse(player.x,player.y+2,26,9,0,0,Math.PI*2);ctx.fill();
 const atlas=player.moving&&CEO_WALK.complete&&CEO_WALK.naturalWidth?CEO_WALK:CEO_IDLE;
 if(atlas.complete&&atlas.naturalWidth){
  const frameWidth=48,frameHeight=72;
  const col=player.moving?player.frame:0;
  const row=Math.max(0,DIRECTIONS.indexOf(player.face));
  const displayScale=1.42;
  // Textures share the exact original V4 CEO visual identity.
  ctx.save();ctx.imageSmoothingEnabled=false;
  ctx.drawImage(atlas,col*frameWidth,row*frameHeight,frameWidth,frameHeight,
   player.x-frameWidth*displayScale/2,player.y-frameHeight*displayScale+7,
   frameWidth*displayScale,frameHeight*displayScale);
  ctx.restore();
 }else{
  // Loading fallback only; NEVER imitate the final CEO with a fake custom character.
  ctx.fillStyle='#25384b';ctx.beginPath();ctx.arc(player.x,player.y-28,17,0,Math.PI*2);ctx.fill();
 }
}
function computeNearest(){
 let best=null;
 for(const q of [...GEOM.portals,...GEOM.hotspots]){
  const dist=Math.hypot(q.xy[0]-player.x,q.xy[1]-player.y);
  if(dist<=108&&(!best||dist<best.d))best={...q,d:dist,kind:GEOM.portals.includes(q)?'portal':'hotspot'};
 }
 return best;
}
function frame(t){
 const dt=Math.min((t-last)/1000||0,0.04);last=t;updateMotion(dt);
 ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#101820';ctx.fillRect(0,0,c.width,c.height);
 ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
 if(BKG.complete&&BKG.naturalWidth)ctx.drawImage(BKG,0,0,1672,941);
 if(debug){ctx.strokeStyle='#5ce0ec';ctx.lineWidth=4;ctx.strokeRect(...GEOM.walk_bounds);
  ctx.fillStyle='#e8363945';ctx.strokeStyle='#d23b32';for(const [x,y,w,h]of GEOM.solids){ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);}}
 nearest=computeNearest();
 if(nearest){
  ctx.strokeStyle='#f3db9c';ctx.fillStyle='#192d31be';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(nearest.xy[0],nearest.xy[1]+2,26,10,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 }
 if(debug){ctx.fillStyle='#30d994';for(const q of [...GEOM.portals,...GEOM.hotspots]){
  ctx.beginPath();ctx.arc(q.xy[0],q.xy[1],9,0,Math.PI*2);ctx.fill();}}
 actorDraw();
 // Overpaint the CEO only with original-photo transparent leaf/planter pixels
 // when their planted-foot depth is in front of the player's ground point.
 // No solid rectangles, no background repaint, no painted-on new foliage.
 for(const layer of FOLIAGE){if(player.y<layer.depth && layer.img.complete && layer.img.naturalWidth){
   ctx.save();ctx.imageSmoothingEnabled=false;
   ctx.drawImage(layer.img,layer.origin[0],layer.origin[1]);ctx.restore();
 }}
 ctx.restore();
 coords.textContent=Math.round(player.x)+','+Math.round(player.y);
 hint.textContent=nearest?'可交互 · '+(INTERACTIVE_NAMES[nearest.id]||nearest.id):'沿人行道移动，走近书店或小馆门前';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const axis=()=>{
 const dx=touchStart.dx||0,dy=touchStart.dy||0;let value={x:0,y:0};
 if(Math.hypot(dx,dy)>22){const horizontal=Math.abs(dx)>=Math.abs(dy),raw=Math.abs(horizontal?dx:dy);
  const amount=Math.min(Math.max((raw-22)/72,0),1);
  value=horizontal?{x:Math.sign(dx)*amount,y:0}:{x:0,y:Math.sign(dy)*amount};}
 input=value;knob.style.transform='translate('+(input.x*32)+'px,'+(input.y*32)+'px)';
};
function showStick(ev){touchStart={x:ev.clientX,y:ev.clientY,dx:0,dy:0};stick.style.left=(ev.clientX-55)+'px';stick.style.top=(ev.clientY-55)+'px';stick.style.display='block';axis();}
window.addEventListener('pointerdown',ev=>{
 if(ev.target.closest('button,#bar,#note,#debugPanel'))return;
 if(ev.clientX>innerWidth/2||touchId!==null)return;
 touchId=ev.pointerId;showStick(ev);ev.preventDefault();
});
window.addEventListener('pointermove',ev=>{
 if(touchId!==ev.pointerId)return;
 touchStart.dx=ev.clientX-touchStart.x;touchStart.dy=ev.clientY-touchStart.y;
 axis();ev.preventDefault();
});
function release(ev){if(touchId!==ev.pointerId)return;touchId=null;input={x:0,y:0};stick.style.display='none';}
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
function resetAll(){
 held.clear();padHeld.clear();player.actualSpeed=0;input={x:0,y:0};touchId=null;stick.style.display='none';
 document.querySelectorAll('#dpad .move').forEach(b=>b.classList.remove('pressing'));
}
window.addEventListener('blur',resetAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)resetAll();});
function nudge(dir){
 const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[dir];if(!d)return;
 let travelled=0;for(let j=0;j<7;j++)travelled+=move(d[0]*4,d[1]*4);
 player.face=d[0]<0?'left':d[0]>0?'right':d[1]<0?'up':'down';
 if(travelled>0){player.stride+=travelled;player.frame=Math.floor(player.stride/28)%4;}
}
for(const b of document.querySelectorAll('#dpad .move')){
 const dir=b.dataset.dir;let pressStart=0,pressId=null,startPos=null;
 const end=(e,canceled=false)=>{
  if(pressId===null)return;if(e&&e.pointerId!==pressId)return;
  const quick=!canceled&&(performance.now()-pressStart)<175;
  const distance=startPos?Math.hypot(player.x-startPos.x,player.y-startPos.y):0;
  pressId=null;padHeld.delete(dir);b.classList.remove('pressing');
  if(quick&&distance<15)nudge(dir);
  if(e){e.stopPropagation();e.preventDefault();}
 };
 b.addEventListener('pointerdown',e=>{if(pressId!==null)return;
  pressId=e.pointerId;pressStart=performance.now();startPos={x:player.x,y:player.y};
  padHeld.add(dir);b.classList.add('pressing');try{b.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();e.stopPropagation();});
 b.addEventListener('pointerup',e=>end(e));b.addEventListener('pointercancel',e=>end(e,true));
 b.addEventListener('lostpointercapture',e=>end(e,true));b.addEventListener('contextmenu',e=>e.preventDefault());
}
window.addEventListener('keydown',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(k.startsWith('Arrow')||['w','a','s','d'].includes(k)){held.add(k);e.preventDefault();}
 if(!e.repeat&&(k==='e'||k===' ')){activate();e.preventDefault();}
});
window.addEventListener('keyup',e=>held.delete(e.key.length===1?e.key.toLowerCase():e.key));
function activate(){
 const q=computeNearest();note.style.display='block';
 note.textContent=q?(
  q.target==='city'?'返回主城区入口已核实；本页暂不切入完整主城区。':
  q.target&&q.target!=='city'?'已到 '+(INTERACTIVE_NAMES[q.id]||q.id)+' 门前。碰撞与交互有效；完整室内在正式 V4 接入。':
  q.id==='future_extension_closed'?'道路尚未开放，未来新区域归 V5。':
  '场景互动位置有效：'+(INTERACTIVE_NAMES[q.id]||q.id)
 ):'还没靠近可交互的位置';
 if(noticeTimer)clearTimeout(noticeTimer);
 noticeTimer=setTimeout(()=>{note.style.display='none';},2600);
}
document.getElementById('action').onclick=activate;
document.getElementById('toggle').onclick=()=>{
 debug=!debug;debugPanel.classList.toggle('visible',debug);
};
// Visible to QA only. Not a gameplay feature or project/fund override.
window.__CT_PREVIEW_QA__={getPlayer:()=>({...player}),getGeometry:()=>GEOM,getNearest:()=>computeNearest(),spriteStatus:()=>({idle:CEO_IDLE.naturalWidth,walk:CEO_WALK.naturalWidth}),foregroundStatus:()=>FOLIAGE.map(l=>({id:l.id,w:l.img.naturalWidth,h:l.img.naturalHeight,depth:l.depth}))};
