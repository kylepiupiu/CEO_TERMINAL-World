 x=1672;while(x<WORLD.width){const size=Math.min(580,WORLD.width-x);imagePart(1088,808,size,133,x,808,size,133);x+=size;}
}
function buildingTop(){
 // Underlay from original masonry prevents black seams between separate facades.
 imagePart(1040,0,630,317,1672,0,1672,317,'saturate(.77)');
 // CEO SOHO: red brick and warm masonry directly from the existing company office.
 imagePart(300,0,428,317,1693,0,523,317);
 // Extra close-spaced upper-floor windows express a taller office, without changing projection.
 imagePart(335,0,355,89,1742,0,431,90);
 bg.fillStyle='#504039b0';bg.fillRect(1797,139,325,55);sign(1824,142,271,'CEO SOHO');
 // Technology tower: existing light stone + blue-grey office fenestration.
 imagePart(990,0,465,317,2235,0,475,317,'saturate(.87)');
 // Neutral original-color masonry covers the copied customer-office plaque.
 // Restore windows from the same old office facade; omit its inherited plaque.
 imagePart(1495,61,163,108,2420,85,285,88,'saturate(.86)');
 bg.fillStyle='#d5c7b8';bg.fillRect(2313,138,316,59);sign(2326,141,289,'科技大厦');
 // Public service: match the old customer office rather than a glass commercial tower.
 imagePart(1050,0,620,317,2724,0,620,317,'saturate(.5) brightness(.94)');
 bg.fillStyle='#82868a33';bg.fillRect(2724,0,620,316);
 // Civic entablature: sober stonework removes inherited '客户单位' signage.
 bg.fillStyle='#b9bab8';bg.fillRect(2855,90,314,87);
 bg.strokeStyle='#8c9195';bg.lineWidth=1;bg.strokeRect(2855,90,314,87);
 for(let z=2890;z<3170;z+=68){bg.beginPath();bg.moveTo(z,90);bg.lineTo(z,140);bg.stroke();}
 // Uniform restrained stone piers and symmetric entry; deliberately no retail lighting.
 bg.fillStyle='#acaaa733';
 for(let x=2770;x<=3290;x+=98)bg.fillRect(x,25,9,244);
 bg.fillStyle='#c7c8c4';bg.fillRect(2860,132,351,67);
 sign(2880,139,312,'政务服务大楼','government');
 // Stone entrance bands match the source civic-office steps.
 bg.fillStyle='#a5a49d66';bg.fillRect(2852,287,366,12);
}
function buildingBottom(){
 // Continuous original storefront masonry as a base behind the public alley.
 for(let x=1672;x<3344;x+=580){let w=Math.min(580,3344-x);imagePart(1088,565,w,243,x,565,w,243);}
 // Same original V4 shopfront masonry, signs and dusk lighting; only shop identity changes.
 imagePart(1088,565,581,252,1710,565,722,252);
 imagePart(617,565,387,252,2585,565,758,252);
 // Hide copied sign text with local, palette-matched facias rather than new glass architecture.
 bg.fillStyle='#503c30';bg.fillRect(1910,603,340,66);sign(1931,610,310,'忒修斯书店');

 // A real, walkable pedestrian connection between roadway and lower shop entrances.
 for(let y=565;y<810;y+=64){imagePart(302,315,132,Math.min(64,810-y),2437,y,146,Math.min(64,810-y));}
 bg.fillStyle='#35312b65';bg.fillRect(2435,565,3,246);bg.fillRect(2582,565,3,246);
 // The lower shopfront footpath is continuous with the copied original paving.
 for(let x=1672;x<3344;x+=290){let w=Math.min(290,3344-x);imagePart(300,809,w,58,x,808,w,58);}

function drawStage(){
 if(!CITY.complete||!CITY.naturalWidth)return;
 bg.clearRect(0,0,3344,941);
 bg.drawImage(CITY,0,0,1672,941); // Pixel-identical original city: absolutely no repaint.
 horizontalRoad();buildingTop();buildingBottom();
 state.loaded=true;
}
CITY.onload=drawStage;
function resize(){const dpr=Math.min(devicePixelRatio||1,2.5);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);state.scale=canvas.height/941;ctx.imageSmoothingEnabled=true;}
window.addEventListener('resize',resize);resize();
function allowed(x,y){
 const r=12.45;
 if(x<22+r||x>WORLD.width-r||y<300+r||y>915-r)return false;
 for(const [a,b,w,h] of [...MAIN_SOLIDS,...EXT_SOLIDS])if(x>a-r&&x<a+w+r&&y>b-r&&y<b+h+r)return false;
 return true;
}
function move(dx,dy){let beforeX=state.x,beforeY=state.y;
 if(allowed(state.x+dx,state.y+dy)){state.x+=dx;state.y+=dy;}
 else{if(allowed(state.x+dx,state.y))state.x+=dx;if(allowed(state.x,state.y+dy))state.y+=dy;}
 return Math.hypot(state.x-beforeX,state.y-beforeY);
}
function direction(){let dx=Number(held.has('right'))-Number(held.has('left')),dy=Number(held.has('down'))-Number(held.has('up'));
 if(!dx&&!dy){dx=dragVector.x;dy=dragVector.y;}
 if(Math.abs(dx)>=Math.abs(dy)&&Math.abs(dx)>.02)return {x:Math.sign(dx),y:0};
 if(Math.abs(dy)>.02)return {x:0,y:Math.sign(dy)};return{x:0,y:0};
}
function nearest(){let found=null;for(const p of PORTALS){let d=Math.hypot(state.x-p.xy[0],state.y-p.xy[1]);if(d<106&&(!found||d<found.distance))found={...p,distance:d};}return found;}
function drawActor(){
 const x=state.x,y=state.y;
 ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y,24,8,0,0,Math.PI*2);ctx.fill();
 const atlas=state.moving&&PLAYER_WALK.complete&&PLAYER_WALK.naturalWidth?PLAYER_WALK:PLAYER_IDLE;
 if(atlas.complete&&atlas.naturalWidth){
  const row={down:0,left:1,right:2,up:3}[state.dir],col=state.moving?state.frame:0;
  ctx.save();ctx.imageSmoothingEnabled=false;
  ctx.drawImage(atlas,col*48,row*72,48,72,x-35,y-101,70,105);
  ctx.restore();
 }else{ctx.fillStyle='#2a4054';ctx.fillRect(x-14,y-72,28,72);}
}
function draw(t){
 const dt=Math.min((t-state.last)/1000||0,.045);state.last=t;
 const v=direction();let dist=0;
 if(v.x||v.y){state.speed=Math.min(220,state.speed+1250*dt);dist=move(v.x*state.speed*dt,v.y*state.speed*dt);state.dir=v.x?(v.x>0?'right':'left'):(v.y>0?'down':'up');}
 else state.speed=0;
 state.moving=dist>.04;if(state.moving){state.walk+=dist;state.frame=Math.floor(state.walk/28)%4;}else{state.frame=0;state.walk=0;}
 let viewW=canvas.width/state.scale;
 state.camera=Math.max(0,Math.min(WORLD.width-viewW,state.x-viewW*.50));
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#121820';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(state.scale,0,0,state.scale,-state.camera*state.scale,0);
 if(state.loaded)ctx.drawImage(STAGE,0,0);
 if(state.debug){ctx.lineWidth=2;ctx.strokeStyle='#ef4444';ctx.fillStyle='#ff20202c';for(const [x,y,w,h] of [...MAIN_SOLIDS,...EXT_SOLIDS]){ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);}}
 const near=nearest();if(near){ctx.beginPath();ctx.strokeStyle='#ecd7a3';ctx.lineWidth=3;ctx.ellipse(near.xy[0],near.xy[1]+3,22,8,0,0,Math.PI*2);ctx.stroke();}
 drawActor();
 if(state.debug){ctx.fillStyle='#35f3a7';for(const p of PORTALS){ctx.beginPath();ctx.arc(p.xy[0],p.xy[1],8,0,Math.PI*2);ctx.fill();}}
 ctx.setTransform(1,0,0,1,0,0);
 status.textContent=state.x<1672?'原主城区':'右侧延伸街区';
 hint.textContent=near?'可交互 · '+near.name:state.x<1672?'向右走，街道与新地图无缝连接':'街道延续原版材质 · 沿下方小路可到书店和小馆';
 if(state.debug)debugEl.textContent='('+state.x.toFixed(0)+','+state.y.toFixed(0)+') 摄像机='+state.camera.toFixed(0);
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function show(title,message){document.getElementById('noticeTitle').textContent=title;document.getElementById('noticeText').textContent=message;document.getElementById('notice').style.display='block';clearTimeout(state.notice);state.notice=setTimeout(()=>document.getElementById('notice').style.display='none',4000);}
function interact(){const p=nearest();if(!p){show('尚未到达入口','请沿街道移动，靠近建筑正门后再交互。');return;}
 const msg=p.kind==='original'?'原主城区既有入口保持原坐标与命名；本 HTML 不替代正式 V4 经营版。':p.id==='technology'?'科技大厦作为未来企业入驻的承载建筑：当前只保留建筑名称、公共导览和扩展接口，不提前开放租户及玩法。':p.id==='government'?'政务服务大楼的严肃外立面和入口已经标记；本轮只进行外观、通道及碰撞验收。':p.id==='bookshop'?'书店外立面与道路已对齐。原先确认的书店室内原画不在本次地图样机中重新设计。':'建筑入口位置已标记；未引入销售、时间、财务或存档规则。';
 show(p.name,msg);
}
document.getElementById('interact').onclick=interact;
document.getElementById('hitbox').onclick=()=>{state.debug=!state.debug;debugEl.style.display=state.debug?'block':'none';};
document.getElementById('reset').onclick=()=>{state.x=840;state.y=505;state.speed=0;state.walk=0;};
function releaseAll(){held.clear();dragId=null;dragVector={x:0,y:0};touch.style.display='none';document.querySelectorAll('[data-key]').forEach(b=>b.classList.remove('pressing'));}
for(const b of document.querySelectorAll('[data-key]')){
 let id=null;const key=b.dataset.key;
 b.addEventListener('pointerdown',e=>{id=e.pointerId;held.add(key);b.classList.add('pressing');b.setPointerCapture(id);e.preventDefault();e.stopPropagation();});
 const end=e=>{if(e.pointerId!==id)return;id=null;held.delete(key);b.classList.remove('pressing');e.stopPropagation();e.preventDefault();};
 b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('lostpointercapture',end);
}
const keyboard={arrowleft:'left',arrowright:'right',arrowup:'up',arrowdown:'down',a:'left',d:'right',w:'up',s:'down'};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keyboard[k]){held.add(keyboard[k]);e.preventDefault();}if(!e.repeat&&(k==='e'||k===' ')){interact();e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keyboard[k])held.delete(keyboard[k]);});
window.addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
window.addEventListener('pointerdown',e=>{if(e.target.closest('button,#header,#notice,#status'))return;if(e.clientX>innerWidth*.5||dragId!==null)return;dragId=e.pointerId;dragStart=[e.clientX,e.clientY];touch.style.display='block';touch.style.left=(e.clientX-47)+'px';touch.style.top=(e.clientY-47)+'px';e.preventDefault();});
window.addEventListener('pointermove',e=>{if(dragId!==e.pointerId)return;let dx=e.clientX-dragStart[0],dy=e.clientY-dragStart[1];dragVector=Math.abs(dx)>=Math.abs(dy)?{x:Math.sign(dx)*(Math.abs(dx)>18),y:0}:{x:0,y:Math.sign(dy)*(Math.abs(dy)>18)};document.getElementById('knob').style.transform='translate('+(dragVector.x*27)+'px,'+(dragVector.y*27)+'px)';e.preventDefault();});
const dragEnd=e=>{if(dragId!==e.pointerId)return;dragId=null;dragVector={x:0,y:0};touch.style.display='none';};
window.addEventListener('pointerup',dragEnd);window.addEventListener('pointercancel',dragEnd);
window.__CT_V4_CITY_QA__={WORLD,MAIN_SOLIDS,EXT_SOLIDS,PORTALS,ORIGINAL_ROAD,BUILDING_STYLE,state,getPosition:()=>({x:state.x,y:state.y}),allowed,move,setPosition:(x,y)=>{if(allowed(x,y)){state.x=x;state.y=y;return true;}return false;},drawStage};
